[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "remarkable-ai-inbox"
version = "0.1.0"
description = "A lightweight AI inbox for handwritten reMarkable notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.6,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
remarkable = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__main__.py", "app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
